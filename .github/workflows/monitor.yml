name: Monitor de descargas

on:
  schedule:
    - cron: "4-59/5 * * * *"   # cada 5 min en :04, :09, :14… (evita los minutos redondos, que GitHub suele saltarse)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write            # para guardar estado.json en el repo

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar descargas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 monitor.py

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Actualizar contadores de descargas"
            git push
          fi
